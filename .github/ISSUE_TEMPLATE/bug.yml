name: 버그
description: 기대와 다르게 동작한다
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소다. 메일 주소, 조직과 저장소 이름, Slack ID, 토큰, 경로의 사용자 이름은 가리고 붙인다.
        보안 문제는 여기에 쓰지 않는다. Security 탭의 Report a vulnerability로 알린다.
        먼저 [문제 해결](https://github.com/blan22/Kairos/blob/main/docs/troubleshooting.md)을 본다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나
      description: 한 일, 기대한 것, 실제로 본 것
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일으키는 순서
      placeholder: |
        1. kairos …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kairos 판
      description: kairos --version 의 출력
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방식
      description: kairos update 가 알려 준다
      options:
        - 저장소에서 빌드
        - 릴리스 묶음
        - 모름
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 판
      description: sw_vers -productVersion 의 출력
  - type: textarea
    id: doctor
    attributes:
      label: kairos doctor 출력
      description: 개인 값을 가리고 붙인다
      render: text
  - type: checkboxes
    id: checked
    attributes:
      label: 확인
      options:
        - label: 붙인 내용에 실제 사람, 조직, 저장소의 값과 토큰이 없다
          required: true
