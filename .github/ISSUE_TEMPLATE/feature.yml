name: 기능 제안
description: 새 동작이나 바꾸면 좋을 점을 알려 주세요
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소입니다. 예시에는 합성 값(`contoso`, `contoso.example`)만 써 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 풀고 싶은 문제
      description: 지금 무엇이 불편한가요? 어떤 상황에서 생기나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 바라는 동작
      description: 명령, 출력, 화면이 어떻게 되면 좋을까요?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회 방법
  - type: checkboxes
    id: floor
    attributes:
      label: 확인
      options:
        - label: SECURITY.md의 보안 기준을 완화하지 않습니다. 완화가 필요하다면 그 이유를 위에 적었습니다.
          required: true
