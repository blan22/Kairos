name: 제안
description: 새 동작이나 바꿀 점
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소다. 예시에는 합성 값만 쓴다(`contoso`, `contoso.example`).
  - type: textarea
    id: problem
    attributes:
      label: 풀려는 문제
      description: 지금 무엇이 불편한가. 어떤 상황에서 생기나
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 바라는 동작
      description: 명령, 출력, 화면이 어떻게 되면 좋은가
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회
  - type: checkboxes
    id: floor
    attributes:
      label: 확인
      options:
        - label: 보안 바닥값(SECURITY.md)을 넓히지 않는다. 넓힌다면 그 이유를 위에 적었다
          required: true
